# Runs the tests and the code checks on every push, like "make check" does locally
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Check that composer.lock matches composer.json
        run: composer validate --no-check-publish

      # Installs the dependencies, caching them between runs
      - uses: ramsey/composer-install@v3

      - name: Tests
        run: vendor/bin/phpunit

      - name: Static analysis (PHPStan)
        run: |
          php bin/console cache:warmup
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Symfony lints (templates, config, services)
        run: |
          php bin/console lint:twig templates
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container
