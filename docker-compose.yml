services:
  app:
    build: .
    # Run as the host user, so that files created in var/ and vendor/ belong to you
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-8000}:8000"
    command: php -S 0.0.0.0:8000 -t public
